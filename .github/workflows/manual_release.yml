# Description: Auto compile
#

#
# Fork and compile the latest version yourself using Github Actions
#   1.Into the repository of your own fork
#   2.Into the repository [Settings]
#   3.[Code and automation - Actions] ↓ [General] → [Workflow permissions] ↓  Check the [Read and write permissions] and [Save]
#   4.Let's take [Actions]
#

name: "Auto compile with OpenWrt SDK"
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: "SSH connection to Actions"
        required: false
        default: "false"
      source_repo:
        description: "Source repository (owner/repo)"
        required: false
        default: "jerrykuku/luci-theme-argon"
      source_branch:
        description: "Source branch"
        required: false
        default: "master"
      force_compile:
        description: "Force compile even if no update"
        required: false
        default: "false"
  push:
    branches:
      - "master"
    paths:
      - "luci-theme-argon/Makefile"
env:
  TZ: Asia/Shanghai

jobs:
  job_check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      argon_version: ${{ steps.check_version.outputs.latest_version }}
      has_update: ${{ steps.check_version.outputs.has_update }}
      source_repo: ${{ steps.set_source.outputs.source_repo }}
      source_branch: ${{ steps.set_source.outputs.source_branch }}
      should_build: ${{ steps.check_version.outputs.should_build }}
    steps:
      - name: Set source repository
        id: set_source
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOURCE_REPO="${{ github.event.inputs.source_repo || 'jerrykuku/luci-theme-argon' }}"
            SOURCE_BRANCH="${{ github.event.inputs.source_branch || 'master' }}"
          else
            SOURCE_REPO="${{ github.repository }}"
            SOURCE_BRANCH="master"
          fi
          echo "source_repo=${SOURCE_REPO}" >> $GITHUB_OUTPUT
          echo "source_branch=${SOURCE_BRANCH}" >> $GITHUB_OUTPUT
          echo "Using source repository: ${SOURCE_REPO}"
          echo "Using source branch: ${SOURCE_BRANCH}"

      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: "master"

      - name: Check version
        id: check_version
        env:
          url_release: https://api.github.com/repos/${{ github.repository }}/releases/latest
        run: |
          if [ -f "Makefile" ]; then
            latest_version=$(grep -oP 'PKG_VERSION:=\K.*' Makefile | sed 's/^/v/' || echo "v1.0.0")
          else
            latest_version="v1.0.0"
          fi
          
          latest_release=$(wget -qO- -t1 -T2 ${{env.url_release}} 2>/dev/null | awk -F '"' '/tag_name/{print $4}' || echo "")
          
          force_compile="${{ github.event.inputs.force_compile }}"
          
          if [ "${force_compile}" = "true" ]; then
            has_update="true"
            should_build="true"
            echo "Force compile enabled"
          else
            has_update=$([ "${latest_version}" != "${latest_release}" ] && echo true || echo false)
            should_build="${has_update}"
          fi
          
          echo "latest_version=${latest_version}" >> $GITHUB_OUTPUT
          echo "has_update=${has_update}" >> $GITHUB_OUTPUT
          echo "should_build=${should_build}" >> $GITHUB_OUTPUT
          echo "latest_version: ${latest_version}"
          echo "latest_release: ${latest_release}"
          echo "has_update: ${has_update}"
          echo "should_build: ${should_build}"

      - name: Generate new tag & release
        if: steps.check_version.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: For openwrt official Snapshots LuCI master
          tag_name: ${{steps.check_version.outputs.latest_version}}

  job_build_argon:
    name: Build Argon (master)
    needs: job_check
    if: needs.job_check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install packages
        run: |
          echo "Install packages"
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install zstd build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-venv rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Cache openwrt SDK
        id: cache-sdk
        uses: actions/cache@v3
        with:
          path: sdk
          key: openwrt-sdk-24.10.0-x86-64

      - name: Download and setup OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        env:
          url_sdk: https://archive.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
        run: |
          echo "Downloading OpenWrt SDK..."
          wget -q ${{ env.url_sdk }} -O openwrt-sdk.tar.zst
          echo "Extracting SDK..."
          mkdir -p sdk
          tar --zstd -xf openwrt-sdk.tar.zst -C ./sdk --strip-components=1
          rm openwrt-sdk.tar.zst

      - name: Setup feeds and clone source
        run: |
          cd sdk
          echo "Setting up feeds..."
          echo "src-git base https://github.com/openwrt/openwrt.git;main" > feeds.conf
          echo "src-git-full packages https://github.com/openwrt/packages.git;master" >> feeds.conf
          echo "src-git-full luci https://github.com/openwrt/luci.git;master" >> feeds.conf
          echo "src-git-full routing https://git.openwrt.org/feed/routing.git;master" >> feeds.conf
          
          echo "Cloning source: https://github.com/${{ needs.job_check.outputs.source_repo }}.git (branch: ${{ needs.job_check.outputs.source_branch }})"
          git clone -b ${{ needs.job_check.outputs.source_branch }} --depth=1 https://github.com/${{ needs.job_check.outputs.source_repo }}.git package/luci-theme-argon
          
          echo "Updating feeds..."
          ./scripts/feeds update -a > /dev/null 2>&1
          
          echo "Installing luci-theme-argon..."
          ./scripts/feeds install -a -p luci-theme-argon

      - name: Configure build
        run: |
          cd sdk
          echo "Configuring build..."
          cat > .config << EOF
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-theme-argon=m
          EOF
          
          make defconfig
          echo "Configuration completed"

      - name: Download dependencies
        run: |
          cd sdk
          echo "Downloading dependencies..."
          make download -j8 V=s

      - name: Compile Argon theme
        id: compile
        run: |
          cd sdk
          echo "Starting compilation..."
          echo "make package/luci-theme-argon/{clean,compile} -j$(nproc) V=s"
          make package/luci-theme-argon/clean V=s
          make package/luci-theme-argon/compile -j$(nproc) V=s
          
          echo "Compilation completed, checking output..."
          find bin/ -name "*.ipk" -ls
          
          if [ -d "bin/packages" ]; then
            mkdir -p ../release
            find bin/packages -name "luci-theme*.ipk" -exec cp {} ../release/ \;
            echo "Files copied to release directory:"
            ls -la ../release/
          else
            echo "No packages directory found!"
            exit 1
          fi
          
          cd ..
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FIRMWARE=$PWD/release" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        if: steps.compile.outputs.status == 'success'
        with:
          name: luci-theme-argon-ipk
          path: release/*.ipk

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{needs.job_check.outputs.argon_version}}
          files: ${{ env.FIRMWARE }}/*.ipk
