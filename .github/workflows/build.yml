name: Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  PACKAGE_NAME: luci-theme-argon
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  get-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep 'PKG_VERSION:=' ./Makefile | awk -F '=' '{print $2}' | tr -d ' ')
          test -n "$VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "New Version: ${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          draft: false
          name: "v${{ steps.version.outputs.version }} Release"
          body: |
            ---

            ### Packages Tersedia
            - **OpenWrt 23.05 / 24.10**: 1 file IPK
            - **OpenWrt 25.12**: APK

            ---

            ### Instalasi OpenWrt 23.05 / 24.10
            ```bash
            opkg install ./${{ env.PACKAGE_NAME }}*.ipk
            ```

            ### Instalasi OpenWrt 25.12
            ```bash
            apk add --allow-untrusted ./${{ env.PACKAGE_NAME }}*.apk
            ```

            ### Terima Kasih All
            Terima kasih untuk semua pengguna yang telah coba ini!

            ----

  release:
    name: Release ${{ matrix.arch }}-${{ matrix.branch }}
    needs: get-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            branch: openwrt-24.10
            package_format: ipk
          - arch: x86_64
            branch: openwrt-25.12
            package_format: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up build environment
        run: |
          set -euo pipefail
          mkdir -p feeds/${{ env.PACKAGE_NAME }} artifacts
          rsync -av --exclude='.git/' --exclude='feeds/' --exclude='artifacts/' ./ ./feeds/${{ env.PACKAGE_NAME }}/

      - name: Build package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          FEED_DIR: ${{ github.workspace }}/feeds
          PACKAGES: ${{ env.PACKAGE_NAME }}
          NO_REFRESH_CHECK: true

      - name: List built packages
        run: |
          set -euo pipefail
          find "${{ github.workspace }}/artifacts" -type f \( -name "${{ env.PACKAGE_NAME }}*.ipk" -o -name "${{ env.PACKAGE_NAME }}*.apk" \) | sort

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/release-artifacts"
          PACKAGE_FILE=$(find "${{ github.workspace }}/artifacts" -type f -name "${{ env.PACKAGE_NAME }}*.${{ matrix.package_format }}" | sort | head -n 1)

          if [[ -z "$PACKAGE_FILE" ]]; then
            echo "Package file not found"
            exit 1
          fi

          TARGET_NAME=$(basename "$PACKAGE_FILE")

          cp "$PACKAGE_FILE" "${{ github.workspace }}/release-artifacts/$TARGET_NAME"
          ls -la "${{ github.workspace }}/release-artifacts/"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ needs.get-version.outputs.version }}"
          files: |
            ${{ github.workspace }}/release-artifacts/*
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Clean cache after successful build
        if: success()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            console.log('Starting cache cleanup...');

            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            if (caches.data.total_count === 0) {
              console.log('No caches found');
              return;
            }

            console.log('Found ' + caches.data.total_count + ' cache(s) to delete');

            for (const cache of caches.data.actions_caches) {
              console.log('Deleting: ' + cache.key + ' (' + (cache.size_in_bytes / 1024 / 1024).toFixed(2) + ' MB)');
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                console.log('Successfully deleted: ' + cache.key);
              } catch (error) {
                console.log('Failed to delete ' + cache.key + ': ' + error.message);
              }
            }

            console.log('Cache cleanup completed!');
